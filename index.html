<title>Desafio Volta ao Eixo 7D</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFF7F3;
    --card: #FFFFFF;
    --text: #2A1620;
    --text-2: #5B4651;
    --accent: #B8325A;
    --on-accent: #FFFFFF;
    --accent-soft: #F9DDE4;
    --teal: #1F5F5B;
    --teal-soft: #DCEBE8;
    --border: #EBD3CE;
    --max-width: 520px;
    --font-title: "Bricolage Grotesque", Georgia, serif;
    --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1B1117;
      --card: #2A1B23;
      --text: #FBEFF2;
      --text-2: #CDB4BC;
      --accent: #E0607F;
      --on-accent: #2A1620;
      --accent-soft: #4A2230;
      --teal: #6FC2B8;
      --teal-soft: #1F3A38;
      --border: #473440;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--accent); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .app {
    max-width: var(--max-width);
    margin: 0 auto;
    padding: calc(20px + env(safe-area-inset-top)) 16px 24px;
  }
  .app.has-nav { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }

  /* Tipografia */
  .h-big, .h-screen, .h-card { font-family: var(--font-title); margin: 0; letter-spacing: -0.01em; }
  .h-big { font-size: 32px; font-weight: 800; line-height: 1.15; }
  .h-screen { font-size: 26px; font-weight: 800; line-height: 1.2; }
  .h-card { font-size: 19px; font-weight: 600; line-height: 1.3; }
  .muted { color: var(--text-2); }
  .small { font-size: 14px; }
  .caption { font-size: 12px; }
  p { margin: 0 0 12px; }
  p:last-child { margin-bottom: 0; }

  /* Marca */
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .brand-icon {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--accent); color: var(--on-accent);
    display: grid; place-items: center; flex: none;
  }
  .brand-name { font-family: var(--font-title); font-weight: 800; font-size: 14px; letter-spacing: 0.14em; }

  /* Etiqueta */
  .tag {
    display: inline-block; padding: 5px 12px; border-radius: 999px;
    background: var(--accent-soft); color: var(--text);
    font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    margin-bottom: 12px;
  }

  /* Cartões */
  .card {
    background: var(--card); border-radius: 18px; padding: 18px; margin-bottom: 14px;
    border: 1px solid var(--border);
  }
  .card .h-card { margin-bottom: 8px; }
  .card.soft { background: var(--teal-soft); border-color: transparent; }
  .card.dark { background: var(--text); color: var(--bg); border-color: transparent; }
  .card.dark .muted { color: var(--bg); opacity: .85; }

  /* Botões */
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; min-height: 54px; padding: 12px 18px; border-radius: 14px; border: 0;
    font-size: 16px; font-weight: 600; text-decoration: none; text-align: center;
    background: var(--accent); color: var(--on-accent);
    margin-bottom: 14px;
  }
  .btn.secondary { background: var(--accent-soft); color: var(--text); }
  .btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--border); }

  /* Aviso (janela de confirmação) */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center;
    background: rgba(27, 17, 23, .55); padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
  }
  .modal {
    width: 100%; max-width: calc(var(--max-width) - 32px); background: var(--card); color: var(--text);
    border-radius: 20px; padding: 22px 20px 8px; box-shadow: 0 12px 40px rgba(0, 0, 0, .25);
  }
  .modal .h-card { margin-bottom: 10px; }
  .modal ul { margin: 0 0 12px; padding-left: 20px; }
  .modal .btn { margin-bottom: 10px; }
  @media (min-width: 560px) { .modal-backdrop { align-items: center; } }
  .card.dark .btn { margin: 14px 0 0; }
  .btn-back {
    display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 4px;
    background: none; border: 0; color: var(--accent); font-weight: 600; margin: -8px 0 10px -4px;
  }
  .row-btns { display: flex; gap: 10px; }
  .row-btns .btn { margin-bottom: 0; }

  /* Formulário */
  label.field-label { display: block; font-weight: 600; margin: 24px 0 8px; }
  .input {
    width: 100%; min-height: 54px; padding: 12px 16px; border-radius: 14px;
    border: 1.5px solid var(--border); background: var(--card); font-size: 16px; margin-bottom: 14px;
  }
  .input::placeholder { color: var(--text-2); opacity: .8; }
  .input:focus { outline: none; border-color: var(--accent); }
  .input[aria-invalid="true"] { border-color: var(--accent); }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .field-row > div { min-width: 0; }
  .field-row label.field-label { margin-top: 4px; }
  .unit-wrap { position: relative; }
  .unit-wrap .input { padding-right: 46px; }
  .unit { position: absolute; right: 16px; top: 16px; color: var(--text-2); font-size: 14px; pointer-events: none; }
  .form-section { margin: 26px 0 4px; }
  .form-error { color: var(--accent); font-weight: 600; font-size: 14px; margin: 0 0 14px; }
  .btn[aria-disabled="true"] { opacity: .5; }
  .btn.link-card { justify-content: space-between; text-align: left; }
  .tip-list { margin: 0; padding-left: 20px; }
  .tip-list li + li { margin-top: 6px; }

  /* Progresso */
  .progress { display: flex; align-items: center; gap: 18px; }
  .ring { position: relative; width: 112px; height: 112px; flex: none; }
  .ring svg { display: block; transform: rotate(-90deg); }
  .ring-label {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-family: var(--font-title); font-weight: 800; font-size: 24px;
  }
  .ring circle { transition: stroke-dashoffset .5s ease; }

  /* Lista de dias */
  .section-title { margin: 26px 0 12px; }
  .day-row {
    display: flex; align-items: center; gap: 14px; width: 100%; min-height: 64px;
    padding: 12px 14px; margin-bottom: 10px; border-radius: 16px;
    background: var(--card); border: 1px solid var(--border); text-align: left;
  }
  .day-dot {
    width: 30px; height: 30px; border-radius: 50%; flex: none;
    display: grid; place-items: center; font-weight: 600; font-size: 14px;
    border: 1.5px solid var(--border); color: var(--text-2);
  }
  .day-dot.done { background: var(--teal); border-color: var(--teal); color: var(--card); }
  .day-text { flex: 1; min-width: 0; }
  .day-title { display: block; font-weight: 600; }
  .day-sub { display: block; font-size: 14px; color: var(--text-2); }
  .chev { color: var(--text-2); flex: none; }

  /* Áudio */
  .audio {
    display: flex; align-items: center; gap: 14px; padding: 14px 16px;
    background: var(--teal-soft); border-radius: 14px; margin-top: 12px;
  }
  .audio-play {
    width: 48px; height: 48px; border-radius: 50%; border: 0; flex: none;
    background: var(--teal); color: var(--card); display: grid; place-items: center; opacity: .55; cursor: not-allowed;
  }
  .placeholder { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: var(--text-2); }

  /* Vídeo */
  .video {
    aspect-ratio: 16 / 9; border-radius: 14px; background: var(--teal-soft); color: var(--teal);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; margin-top: 12px;
  }
  .video .placeholder { color: var(--teal); }
  .card .btn { margin: 12px 0 0; }

  /* Conclusão do dia, "Não consegui completar" e comentários */
  .hint { font-size: 14px; color: var(--text-2); text-align: center; margin: -4px 0 14px; }
  .textarea {
    width: 100%; min-height: 104px; padding: 12px 16px; border-radius: 14px; resize: vertical;
    border: 1.5px solid var(--border); background: var(--card); font-size: 16px; line-height: 1.5; display: block;
  }
  .textarea:focus { outline: none; border-color: var(--accent); }
  .textarea::placeholder { color: var(--text-2); opacity: .8; }
  .saved-note { font-size: 12px; color: var(--text-2); margin: 6px 0 0; min-height: 18px; }
  details.fold { padding: 0; }
  details.fold > summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    min-height: 56px; padding: 14px 18px; font-weight: 600;
  }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary svg { transition: transform .2s ease; flex: none; color: var(--text-2); }
  details.fold[open] > summary svg { transform: rotate(90deg); }
  details.fold .fold-body { padding: 0 18px 18px; }
  .recovery { border: 2px solid var(--teal); }

  /* Fotos */
  .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
  .photo-slot { min-width: 0; }
  .photo-box {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    aspect-ratio: 3 / 4; max-width: 100%; border-radius: 14px; border: 1.5px dashed var(--border);
    background: var(--bg); color: var(--text-2); cursor: pointer; overflow: hidden;
    font-size: 12px; font-weight: 600; text-align: center; padding: 6px;
  }
  .photo-box.has-img { padding: 0; border-style: solid; }
  .photo-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-slot:focus-within .photo-box { outline: 3px solid var(--accent); outline-offset: 2px; }
  .photo-name { display: block; text-align: center; font-size: 12px; color: var(--text-2); margin-top: 4px; }
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .compare + .compare { margin-top: 18px; }
  .compare-title { grid-column: 1 / -1; font-weight: 600; font-size: 14px; }

  /* Evolução */
  .evo-wrap { overflow-x: auto; margin-top: 8px; }
  .evo-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 15px; }
  .evo-table th, .evo-table td { padding: 10px 6px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .evo-table th:first-child, .evo-table td:first-child { text-align: left; padding-left: 0; }
  .evo-table th { font-size: 12px; font-weight: 600; color: var(--text-2); letter-spacing: .04em; text-transform: uppercase; }
  .evo-table td:last-child { font-weight: 600; color: var(--teal); }
  .evo-table tr:last-child td { border-bottom: 0; }
  .consent { border-top: 0 !important; margin: 18px 0 6px; }
  .consent span { font-size: 14px; }
  .day-row:disabled { cursor: not-allowed; opacity: .6; }
  @media (prefers-reduced-motion: reduce) { details.fold > summary svg { transition: none; } }

  /* Passos */
  .step {
    display: flex; align-items: flex-start; gap: 12px; min-height: 44px; padding: 10px 0; cursor: pointer;
  }
  .step + .step { border-top: 1px solid var(--border); }
  .step input {
    appearance: none; -webkit-appearance: none; margin: 0; flex: none;
    width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--teal); background: var(--card);
    display: grid; place-items: center; cursor: pointer;
  }
  .step input:checked { background: var(--teal); }
  .step input:checked::after {
    content: ""; width: 7px; height: 13px; border: solid var(--card); border-width: 0 3px 3px 0;
    transform: translateY(-2px) rotate(45deg);
  }
  .step span { padding-top: 1px; }
  .step input:checked + span { color: var(--text-2); }

  /* Prato */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 18px 0 14px; }
  .grid2 .card { margin: 0; }
  .dot { width: 14px; height: 14px; border-radius: 50%; margin-bottom: 10px; }
  .grid2 .h-card { font-size: 17px; }

  /* Cronômetro */
  .timer {
    font-family: var(--font-title); font-weight: 800; font-size: 64px; line-height: 1;
    text-align: center; margin: 18px 0 20px; font-variant-numeric: tabular-nums;
  }

  /* Rodapé */
  .footer { margin-top: 28px; font-size: 12px; color: var(--text-2); text-align: center; }

  /* Menu inferior */
  .nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--card); border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav-inner { max-width: var(--max-width); margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
  .nav button {
    min-height: 60px; border: 0; background: none; color: var(--text-2);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    font-size: 12px; font-weight: 600;
  }
  .nav button[aria-current="page"] { color: var(--accent); }

  .stack-top { margin-top: 6px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
</style>
</head>

const TOTAL = CONFIG.days.length;

function emptyProgress() {
  return {
    done: Array(TOTAL).fill(false),
    recovered: Array(TOTAL).fill(false), // dia concluído pela tarefa de recuperação
    steps: CONFIG.days.map(d => d.steps.map(() => false)),
    notes: Array(TOTAL).fill(''),        // comentários do dia
    reasons: Array(TOTAL).fill('')       // motivo de não ter completado
  };
}
function loadState() {
  const base = { name: null, phone: null, consent: false, start: null, final: null, device: null, ...emptyProgress() };
  try {
    const saved = JSON.parse(localStorage.getItem(CONFIG.storageKey) || 'null');
    if (saved && typeof saved === 'object') {
      if (typeof saved.name === 'string') base.name = saved.name;
      if (saved.start && typeof saved.start === 'object' && saved.start.measures) base.start = saved.start;
      if (saved.final && typeof saved.final === 'object' && saved.final.measures) base.final = saved.final;
      if (typeof saved.phone === 'string') base.phone = saved.phone;
      if (typeof saved.device === 'string') base.device = saved.device;
      base.consent = saved.consent === true;
      base.noPhotos = saved.noPhotos === true;
      if (Array.isArray(saved.done)) base.done = base.done.map((_, i) => !!saved.done[i]);
      if (Array.isArray(saved.recovered)) base.recovered = base.recovered.map((_, i) => !!saved.recovered[i]);
      ['notes', 'reasons'].forEach(k => {
        if (Array.isArray(saved[k])) base[k] = base[k].map((_, i) => typeof saved[k][i] === 'string' ? saved[k][i] : '');
      });
      if (Array.isArray(saved.steps)) {
        base.steps = base.steps.map((row, i) => row.map((_, j) => !!(saved.steps[i] && saved.steps[i][j])));
      }
    }
  } catch (e) { /* armazenamento indisponível: segue sem salvar */ }
  if (!base.device) base.device = 'ap-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  return base;
}
function saveState() {
  try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(state)); } catch (e) { /* ignora */ }

const OUTBOX_KEY = CONFIG.storageKey + '-envios';
let outbox = [];
try { outbox = JSON.parse(localStorage.getItem(OUTBOX_KEY) || '[]'); } catch (e) { outbox = []; }

function progressSummary() {
  const last = state.done.lastIndexOf(true);
  return {
    concluidos: doneCount(),
    recuperados: state.recovered.filter((r, i) => r && state.done[i]).length,
    ultimoDia: last === -1 ? '' : last + 1
  };
}

// tipo: cadastro | comentario | nao_consegui | dia | resultado
function track(tipo, extra = {}) {
  const ev = {
    tipo, quando: new Date().toISOString(), aparelho: state.device,
    nome: state.name, whatsapp: state.phone, progresso: progressSummary(), ...extra
  };
  // Comentário e motivo: só a versão mais recente de cada dia precisa ir.
  if (tipo === 'comentario' || tipo === 'nao_consegui') {
    outbox = outbox.filter(o => !(o.tipo === tipo && o.dia === ev.dia));
  }
  outbox.push(ev);
  saveOutbox();
  flushOutbox();
}

let flushing = false;
async function flushOutbox() {
  if (flushing || !CONFIG.sheetUrl || !outbox.length) return;
  flushing = true;
  try {
    while (outbox.length) {
      const ev = outbox[0];
      // text/plain + no-cors: o Apps Script recebe sem bloqueio do navegador.
      await fetch(CONFIG.sheetUrl, {
        method: 'POST', mode: 'no-cors', keepalive: true,
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ ...ev, chave: CONFIG.sheetKey })
      });
      outbox.shift();
      saveOutbox();
    }
  } catch (e) {
    /* sem internet: fica na fila */
  } finally {
    flushing = false;
  }
}
window.addEventListener('online', flushOutbox);

}

const photoUrls = {}; // 'antes-frente' -> URL da imagem
let photoDb = null;

function openPhotoDb() {
  return new Promise(resolve => {
    try {
      const req = indexedDB.open(CONFIG.storageKey + '-fotos', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('fotos');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
    } catch (e) { resolve(null); }
  });
}
function photoTx(mode, fn) {
  return new Promise(resolve => {
    if (!photoDb) return resolve(null);
    try {
      const tx = photoDb.transaction('fotos', mode);
      const req = fn(tx.objectStore('fotos'));
      tx.oncomplete = () => resolve(req && req.result);
      tx.onerror = () => resolve(null);
    } catch (e) { resolve(null); }
  });
}
async function loadPhotos() {
  photoDb = await openPhotoDb();
  for (const phase of ['antes', 'depois']) {
    for (const pose of CONFIG.poses) {
      const key = phase + '-' + pose.id;
      const blob = await photoTx('readonly', s => s.get(key));
      if (blob) photoUrls[key] = URL.createObjectURL(blob);
    }
  }
}
// Reduz a foto para no máximo 1200 px, em JPEG, para ocupar pouco espaço.
function shrinkImage(file) {
  return new Promise(resolve => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, 1200 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => resolve(b || file), 'image/jpeg', 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}
async function savePhoto(key, file) {
  const blob = await shrinkImage(file);
  await photoTx('readwrite', s => s.put(blob, key));
  if (photoUrls[key]) URL.revokeObjectURL(photoUrls[key]);
  photoUrls[key] = URL.createObjectURL(blob);
}

function photoSlot(phase, pose) {

}

function ring(n) {

  return `

      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
        <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--border)" stroke-width="${stroke}"/>
        <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--teal)" stroke-width="${stroke}"
          stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}" ${n === 0 ? 'opacity="0"' : ''}/>
      </svg>
      <span class="ring-label" aria-hidden="true">${n}/${TOTAL}</span>
    </div>`;
}

const fmtDiff = d => (d > 0 ? '+' : d < 0 ? '−' : '') + fmt(Math.abs(d));
const fmtDate = iso => iso ? iso.split('-').reverse().join('/') : '';

/* =====================================================================
   CRONÔMETRO (não é salvo; continua rodando ao trocar de tela)
   ===================================================================== */
const timer = { remaining: CONFIG.timerSeconds, running: false, id: null };

function formatTime(s) {
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}
function updateTimerUI() {
  const el = document.getElementById('timer');
  const btn = document.getElementById('timer-toggle');
  if (el) {
    el.textContent = formatTime(timer.remaining);
    const m = Math.floor(timer.remaining / 60), s = timer.remaining % 60;
    el.setAttribute('aria-label', `Tempo restante: ${m} minutos e ${s} segundos`);
  }
  if (btn) btn.textContent = timer.running ? 'Pausar' : 'Iniciar';
}
function timerStop() {
  clearInterval(timer.id);
  timer.id = null;
  timer.running = false;
}
function timerStart() {
  if (timer.remaining <= 0) timer.remaining = CONFIG.timerSeconds;
  timer.running = true;
  timer.id = setInterval(() => {
    timer.remaining = Math.max(0, timer.remaining - 1);
    if (timer.remaining === 0) timerStop();
    updateTimerUI();
  }, 1000);
}

const toInput = v => v == null ? '' : String(v).replace('.', ',');
function formatPhone(p) {
  const d = String(p || '').replace(/^55/, '');
  return d.length < 10 ? d : `(${d.slice(0, 2)}) ${d.slice(2, -4)}-${d.slice(-4)}`;
}

// Apaga tudo deste aparelho e volta para o cadastro vazio.
async function resetEverything() {
  // A planilha registra que ela recomeçou e zera os dias dela (o histórico fica lá).
  track('reinicio', { progresso: { concluidos: 0, recuperados: 0, ultimoDia: '' } });
  await photoTx('readwrite', s => s.clear());
  Object.keys(photoUrls).forEach(k => { URL.revokeObjectURL(photoUrls[k]); delete photoUrls[k]; });
  Object.assign(state, { name: null, phone: null, consent: false, noPhotos: false, start: null, final: null }, emptyProgress());
  saveState();
  draft = { name: '', phone: '', consent: false, noPhotos: false, weight: '', measures: {} };
  finalDraft = { weight: '', measures: {}, editing: false };

   EVENTOS

// Aceita "68,5" ou "68.5". Devolve número ou null.
function parseNumber(v) {
  const n = parseFloat(String(v).trim().replace(',', '.'));
  return Number.isFinite(n) ? n : null;
}

const FIELD_LIMITS = { weight: [25, 300], measure: [20, 250] };

function readForm() {
  const errors = [];
  const name = draft.name.trim();
  if (!name) errors.push({ id: 'name', msg: 'o seu nome' });
  const phone = normalizePhone(draft.phone);
  if (!phone) errors.push({ id: 'phone', msg: 'o seu WhatsApp com DDD' });
  const { weight, measures } = readMeasures(draft, errors);
  // Fotos: as 3 são pedidas, a não ser que ela escolha seguir sem fotos.
  const missingPhotos = CONFIG.poses.filter(p => !photoUrls['antes-' + p.id]);
  if (!draft.noPhotos && missingPhotos.length) {
    errors.push({ id: missingPhotos.length === CONFIG.poses.length ? 'photos-toggle' : 'ph-antes-' + missingPhotos[0].id,
      msg: (missingPhotos.length === CONFIG.poses.length ? 'as suas fotos'
        : (missingPhotos.length > 1 ? 'as fotos ' : 'a foto ') + missingPhotos.map(p => p.label.toLowerCase()).join(' e ')) + ' (ou toque em "Prefiro não adicionar as fotos")' });
  }
  if (!draft.consent) errors.push({ id: 'consent', msg: 'a autorização de envio dos dados' });
  return { errors, name, phone, weight, measures };
}

// Devolve o número com 55 + DDD (ex.: 5511988887777), ou null se estiver incompleto.
function normalizePhone(v) {
  let d = String(v || '').replace(/\D/g, '');
  if (d.length >= 12 && d.startsWith('55')) d = d.slice(2);
  return d.length === 10 || d.length === 11 ? '55' + d : null;
}

// Lê peso e medidas de um rascunho; usado no cadastro e no resultado final.
function readMeasures(src, errors, suffix = '') {
  const weight = parseNumber(src.weight);
  if (weight === null || weight < FIELD_LIMITS.weight[0] || weight > FIELD_LIMITS.weight[1]) errors.push({ id: 'weight' + suffix, msg: 'o peso (em kg)' });
  const measures = {};
  CONFIG.measures.forEach(m => {
    const v = parseNumber(src.measures[m.id]);
    if (v === null || v < FIELD_LIMITS.measure[0] || v > FIELD_LIMITS.measure[1]) errors.push({ id: 'm-' + m.id + suffix, msg: m.label.toLowerCase() + ' (em cm)' });
    else measures[m.id] = v;
  });
  return { weight, measures };
}

function showErrors(errors, boxId, prefix) {
  const box = document.getElementById(boxId);
  document.querySelectorAll('[aria-invalid]').forEach(el => el.removeAttribute('aria-invalid'));
  errors.forEach(err => { const el = document.getElementById(err.id); if (el) el.setAttribute('aria-invalid', 'true'); });
  box.textContent = prefix + errors.map(err => err.msg).join(', ').replace(/, ([^,]*)$/, ' e $1') + '.';
  box.hidden = false;
  const first = document.getElementById(errors[0].id);
  if (first) first.focus();
}

function updateStartButton() {
  const btn = document.getElementById('start-btn');
  if (btn) btn.setAttribute('aria-disabled', readForm().errors.length ? 'true' : 'false');
}

document.addEventListener('input', e => {

  state[field][view.day - 1] = e.target.value;

  if (field === 'reasons') { const err = document.getElementById('reason-error'); if (err) err.hidden = true; }
  if (field === 'notes') {
    const note = document.getElementById('note-saved');

});

  const id = e.target.id;
  if (id === 'name') draft.name = e.target.value;
  else if (id === 'phone') draft.phone = e.target.value;
  else if (id === 'consent') draft.consent = e.target.checked;
  else if (id === 'weight') draft.weight = e.target.value;
  else if (id.startsWith('m-')) draft.measures[id.slice(2)] = e.target.value;

});

  if (id === 'weight-f') finalDraft.weight = e.target.value;
  else if (id.startsWith('m-') && id.endsWith('-f')) finalDraft.measures[id.slice(2, -2)] = e.target.value;
  else return;
  e.target.removeAttribute('aria-invalid');
});

document.addEventListener('submit', e => {
  if (e.target.id !== 'final-form') return;
  e.preventDefault();
  const errors = [];
  const { weight, measures } = readMeasures(finalDraft, errors, '-f');
  if (errors.length) return showErrors(errors, 'final-error', 'Para ver a sua evolução, preencha ');
  state.final = { weight, measures, date: new Date().toISOString().slice(0, 10) };
  finalDraft.editing = false;
  saveState();
  track('resultado', { final: toSheetMeasures(state.final) });
  go('result');
});

// Foto escolhida: reduz, guarda no aparelho e mostra.
document.addEventListener('change', async e => {
  const input = e.target;
  if (!input.dataset || !input.dataset.photo || !input.files || !input.files[0]) return;
  const box = input.previousElementSibling;
  if (box) box.innerHTML = '<span>Salvando…</span>';
  await savePhoto(input.dataset.photo, input.files[0]);
  const y = window.scrollY;
  render();
  window.scrollTo(0, y);
});

document.addEventListener('submit', e => {
  if (e.target.id !== 'welcome-form') return;
  e.preventDefault();
  const { errors, name, phone, weight, measures } = readForm();
  if (errors.length) return showErrors(errors, 'form-error', editingProfile ? 'Para salvar, falta: ' : 'Para começar, falta: ');
  const previousPhone = state.phone;
  state.name = name;
  state.phone = phone;
  state.consent = true;
  state.noPhotos = draft.noPhotos;
  // Na correção, a data de início continua a original.
  state.start = { weight, measures, date: (editingProfile && state.start && state.start.date) || new Date().toISOString().slice(0, 10) };
  saveState();
  track('cadastro', {
    inicio: toSheetMeasures(state.start),
    correcao: editingProfile,
    whatsappAnterior: editingProfile && previousPhone !== phone ? previousPhone : undefined
  });
  go('journey');
});

document.addEventListener('click', e => {
  const el = e.target.closest('button');
  if (!el) return;

  if (el.dataset.go) return go(el.dataset.go);
  if (el.dataset.day) return isUnlocked(Number(el.dataset.day)) && go('day', Number(el.dataset.day));

  switch (el.id) {
    case 'toggle-day': {
      const i = view.day - 1;
      if (state.done[i]) {
        state.done[i] = false;
        state.recovered[i] = false;
      } else if (allStepsDone(i)) {
        state.done[i] = true;
      } else {
        // Ainda faltam passos: mostra o caminho "Não consegui completar".
        const fold = document.getElementById('not-done');
        if (fold) { fold.open = true; fold.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        return;
      }
      saveState();
      track('dia', { dia: view.day, concluido: state.done[i], recuperacao: false });
      if (state.done[i]) nextAfter(view.day);
      else render();
      break;
    }
    case 'go-recovery': {
      const i = view.day - 1;
      if (!state.reasons[i].trim()) {
        document.getElementById('reason-error').hidden = false;
        document.getElementById('reason').focus();
        return;
      }
      go('kit', view.day);
      break;
    }
    case 'recovery-done': {
      const i = view.day - 1;
      state.done[i] = true;
      state.recovered[i] = true;
      saveState();
      track('dia', { dia: view.day, concluido: true, recuperacao: true });
      nextAfter(view.day);
      break;
    }
    case 'edit-data':
      openModal({
        title: 'Corrigir meus dados',
        body: `<p>${esc(CONFIG.editDataMessage)}</p>`,
        confirm: 'Corrigir meus dados',
        onConfirm: startEditProfile
      });
      break;
    case 'cancel-edit':
      go('journey');
      break;
    case 'reset':
      openModal({
        title: 'Reiniciar a jornada do zero?',
        body: `<p>${esc(CONFIG.resetMessage)}</p>
          <ul class="small"><li>nome, WhatsApp, peso e medidas</li><li>fotos</li><li>dias concluídos e passos marcados</li><li>comentários e resultado final</li></ul>
          <p class="small muted">Não dá para desfazer. Se você só quer ajustar o nome, o WhatsApp ou as medidas, use "Corrigir meus dados".</p>`,
        confirm: 'Apagar tudo e recomeçar',
        onConfirm: resetEverything
      });
      break;
    case 'modal-confirm': {
      const fn = modalAction;
      closeModal();
      if (fn) fn();
      break;
    }
    case 'modal-cancel':
      closeModal();
      break;
    case 'photos-toggle': {
      draft.noPhotos = !draft.noPhotos;
      render();
      const t = document.getElementById('photos-title');
      if (t) t.scrollIntoView({ block: 'start' });
      break;
    }
    case 'edit-final':
      finalDraft = {
        weight: String(state.final.weight).replace('.', ','),
        measures: Object.fromEntries(Object.entries(state.final.measures).map(([k, v]) => [k, String(v).replace('.', ',')])),
        editing: true
      };
      go('result');
      break;
    case 'timer-toggle':
      timer.running ? timerStop() : timerStart();
      updateTimerUI();
      break;
    case 'timer-reset':
      timerStop();
      timer.remaining = CONFIG.timerSeconds;
      updateTimerUI();
      break;
  }
});

document.addEventListener('change', e => {
  const box = e.target;
  if (!box.matches('input[data-step]') || view.screen !== 'day') return;
  state.steps[view.day - 1][Number(box.dataset.step)] = box.checked;
  saveState();
  // Atualiza o botão de concluir e a aba "Não consegui completar" sem perder o que foi digitado.
  if (!state.done[view.day - 1]) {
    const y = window.scrollY;
    render();
    window.scrollTo(0, y);
  }
});

render();
loadPhotos().then(() => { if (Object.keys(photoUrls).length) render(); });
flushOutbox();
</script>
</body>
</html>
